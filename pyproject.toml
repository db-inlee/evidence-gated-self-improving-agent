[project]
name = "opsworld"
version = "0.0.0"
description = "EvidenceGate OpsWorld: deterministic synthetic incident world and evidence grader"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "numpy==2.3.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]
writeup = [
    "matplotlib==3.11.2",  # Ticket 007 §2: 그림 결정성을 위해 버전 고정
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsworld", "src/evidencegate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# 문서 안 코드 예시까지 포맷하지 않도록 Markdown은 제외한다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.uv]
default-groups = ["dev", "writeup"]
